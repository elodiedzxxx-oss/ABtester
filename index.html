<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A/B Tester Web</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body>
    <div class="bg-shape bg-shape-1"></div>
    <div class="bg-shape bg-shape-2"></div>

    <main class="container">
      <header class="hero">
        <h1>Social Media Image A/B Tester</h1>
        <p>Pure frontend version - mobile friendly</p>
      </header>

      <section class="card input-card">
        <div class="grid-2">
          <div class="upload-box">
            <h3>Image A</h3>
            <input id="imageA" type="file" accept="image/*" />
            <label>Operation</label>
            <select id="operationA">
              <option>Original</option>
              <option>Grayscale</option>
              <option>Histogram Equalization</option>
              <option>Gaussian Blur</option>
              <option>Sharpen</option>
              <option>Edge Detection</option>
            </select>
            <img id="previewA" class="preview" alt="Preview A" />
          </div>

          <div class="upload-box">
            <h3>Image B</h3>
            <input id="imageB" type="file" accept="image/*" />
            <label>Operation</label>
            <select id="operationB">
              <option>Original</option>
              <option>Grayscale</option>
              <option>Histogram Equalization</option>
              <option>Gaussian Blur</option>
              <option>Sharpen</option>
              <option>Edge Detection</option>
            </select>
            <img id="previewB" class="preview" alt="Preview B" />
          </div>
        </div>

        <div class="actions">
          <button id="analyzeBtn" class="btn btn-primary">Start Analysis</button>
          <button id="resetBtn" class="btn btn-secondary">Reset</button>
        </div>
      </section>

      <section id="resultCard" class="card result-card hidden">
        <div class="result-header">
          <h2 id="winnerText">Recommendation</h2>
          <p id="scoreText"></p>
        </div>

        <div class="grid-2">
          <div class="panel">
            <h3>Feature Comparison</h3>
            <canvas id="featureChart"></canvas>
          </div>
          <div class="panel">
            <h3>Processed Images</h3>
            <div class="processed-grid">
              <div>
                <h4>Processed A</h4>
                <img id="processedA" class="processed-img" alt="Processed A" />
              </div>
              <div>
                <h4>Processed B</h4>
                <img id="processedB" class="processed-img" alt="Processed B" />
              </div>
            </div>
          </div>
        </div>

        <div class="panel">
          <h3>Detailed Insights</h3>
          <ul id="insightList" class="insight-list"></ul>
        </div>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
